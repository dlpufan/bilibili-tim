<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-size: 14px;
            font-family: Arial, sans-serif;
            width: 320px;
            background-color: #00a1d6;
            color: #fff;
            margin: 0;
            padding: 0 12px 12px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 16px;
            margin: 10px 0 8px;
        }

        h2 {
            font-size: 13px;
            margin: 12px 0 6px;
            border-top: 1px solid rgba(255,255,255,0.4);
            padding-top: 8px;
            font-weight: bold;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }

        .fancy-checkbox {
            position: relative;
            padding-left: 28px;
            cursor: pointer;
            user-select: none;
            line-height: 20px;
        }

        .hidden-checkbox {
            position: absolute;
            opacity: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .hidden-checkbox:checked + .checkmark::after {
            content: "";
            position: absolute;
            display: block;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 12px;
            border: solid #333;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        label.inline {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="number"] {
            width: 64px;
            padding: 2px 4px;
            border-radius: 4px;
            border: none;
        }

        input[type="text"] {
            flex: 1;
            padding: 4px 6px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
            color: #333;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: #fff;
            color: #00a1d6;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }

        .btn:hover {
            background: #e8f7fd;
        }

        #imagePreview {
            width: 100%;
            max-height: 80px;
            object-fit: contain;
            border-radius: 4px;
            margin-top: 6px;
            background: rgba(0,0,0,0.15);
            display: none;
        }

        #imagePreview.visible {
            display: block;
        }

        .tip {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .radio-group {
            display: flex;
            gap: 12px;
            margin-bottom: 6px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 id="extension-title">Bilibili Tim 设置</h1>

    <!-- 启用开关 -->
    <label class="fancy-checkbox">
        <input type="checkbox" id="disableExtension" class="hidden-checkbox">
        <span class="checkmark"></span>
        <span>启用插件</span>
    </label>

    <br>

    <!-- 出现概率 -->
    <label class="inline">
        出现概率 (%)：
        <input type="number" id="appearChance" min="0" max="100" step="5" />
    </label>

    <br><br>

    <!-- 翻转概率 -->
    <label class="inline">
        镜像翻转概率 (%)：
        <input type="number" id="flipChance" min="0" max="100" step="5" />
    </label>

    <!-- 自定义图片 -->
    <h2>自定义人物图片</h2>

    <div class="radio-group">
        <label>
            <input type="radio" name="imageSource" id="srcBuiltin" value="builtin">
            使用内置图片
        </label>
        <label>
            <input type="radio" name="imageSource" id="srcCustom" value="custom">
            使用自定义图片
        </label>
    </div>

    <p class="tip">推荐使用背景透明的 PNG 图片，人物站在底部效果最佳。</p>

    <!-- URL 输入 -->
    <div class="row">
        <input type="text" id="customImageURL" placeholder="输入图片 URL（支持 https://…）" />
    </div>

    <!-- 本地文件上传 -->
    <div class="row">
        <button class="btn" id="uploadBtn">上传本地图片</button>
        <input type="file" id="fileInput" accept="image/*">
        <span id="uploadStatus" class="tip"></span>
    </div>

    <!-- 预览 -->
    <img id="imagePreview" alt="图片预览" />

    <script src="settings.js"></script>
</body>

</html>
